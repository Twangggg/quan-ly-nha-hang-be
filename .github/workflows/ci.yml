name: CI Pipeline

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "9.0.x"

            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            - name: Restore dependencies
              run: dotnet restore

            - name: Install EF Core Tools
              run: dotnet tool install --global dotnet-ef

            - name: Check Migrations
              run: |
                  dotnet ef migrations list --project FoodHub.Infrastructure --startup-project FoodHub.WebAPI
                  dotnet ef migrations has-pending-model-changes --project FoodHub.Infrastructure --startup-project FoodHub.WebAPI

            - name: Check Vulnerabilities
              run: |
                  dotnet list package --vulnerable --include-transitive || true
                  dotnet list package --outdated || true

            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Run Tests With Coverage
              run: |
                  dotnet test --no-build --configuration Release \
                    --verbosity normal \
                    --collect:"XPlat Code Coverage" \
                    --results-directory ./coverage

            - name: Generate Coverage Report
              if: always()
              run: |
                  dotnet tool install --global dotnet-reportgenerator-globaltool
                  reportgenerator \
                    -reports:"./coverage/**/coverage.cobertura.xml" \
                    -targetdir:"./coverage-report" \
                    -reporttypes:Html

            - name: Upload Coverage Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: ./coverage-report

            - name: Install SonarScanner
              run: dotnet tool install --global dotnet-sonarscanner

            - name: SonarCloud Analysis
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  dotnet sonarscanner begin \
                    /k:"Twangggg_quan-ly-nha-hang-be" \
                    /o:"twangggg" \
                    /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
                    /d:sonar.host.url="https://sonarcloud.io" \
                    /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
                    /d:sonar.exclusions="**/Migrations/**,**/bin/**,**/obj/**,**/coverage-report/**,**/coverage/**" \
                    /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs"
                  dotnet build --configuration Release --no-restore
                  dotnet test --no-build --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=./coverage.opencover.xml
                  dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

            - name: Log in to Docker Hub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker Image And Push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/foodhub-be:latest
                      ${{ secrets.DOCKER_USERNAME }}/foodhub-be:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        needs: build
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to Server via SSH
              uses: appleboy/ssh-action@master
              env:
                  # Container & Server info
                  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                  SERVER_IP: ${{ secrets.SERVER_IP }}
                  # Database
                  DB_HOST: db
                  DB_PORT: 5432
                  DB_NAME: ${{ secrets.DB_NAME }}
                  DB_USER: ${{ secrets.DB_USER }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  # Redis
                  REDIS_CONNECTION: redis:6379
                  # JWT
                  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
                  JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
                  JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
                  JWT_ACCESS_TOKEN_EXPIRES_IN_MINUTE: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRES_IN_MINUTE }}
                  JWT_REFRESH_TOKEN_EXPIRES_IN_DAYS: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRES_IN_DAYS }}
                  # Email
                  EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
                  EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
                  EMAIL_SENDER_EMAIL: ${{ secrets.EMAIL_SENDER_EMAIL }}
                  EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
                  EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
                  # Cloudinary
                  CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
                  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
                  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
                  # PayOS
                  PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
                  PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
                  PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
                  PAYOS_RETURN_URL: ${{ secrets.PAYOS_RETURN_URL }}
                  PAYOS_CANCEL_URL: ${{ secrets.PAYOS_CANCEL_URL }}
                  # Others
                  ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
                  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
                  OTEL_SERVICE_NAME: ${{ secrets.OTEL_SERVICE_NAME }}
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  envs: DOCKER_USERNAME,SERVER_IP,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,REDIS_CONNECTION,JWT_SECRET_KEY,JWT_ISSUER,JWT_AUDIENCE,JWT_ACCESS_TOKEN_EXPIRES_IN_MINUTE,JWT_REFRESH_TOKEN_EXPIRES_IN_DAYS,EMAIL_SMTP_HOST,EMAIL_SMTP_PORT,EMAIL_SENDER_EMAIL,EMAIL_SENDER_NAME,EMAIL_APP_PASSWORD,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,PAYOS_CLIENT_ID,PAYOS_API_KEY,PAYOS_CHECKSUM_KEY,PAYOS_RETURN_URL,PAYOS_CANCEL_URL,ALLOWED_ORIGINS,OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_SERVICE_NAME
                  script: |
                      cd ~/foodhub
                      # Create/overwrite full .env
                      printf "DOCKER_USERNAME=$DOCKER_USERNAME\nSERVER_IP=$SERVER_IP\nDB_HOST=$DB_HOST\nDB_PORT=$DB_PORT\nDB_NAME=$DB_NAME\nDB_USER=$DB_USER\nDB_PASSWORD=$DB_PASSWORD\nREDIS_CONNECTION=$REDIS_CONNECTION\nJWT_SECRET_KEY=$JWT_SECRET_KEY\nJWT_ISSUER=$JWT_ISSUER\nJWT_AUDIENCE=$JWT_AUDIENCE\nJWT_ACCESS_TOKEN_EXPIRES_IN_MINUTE=$JWT_ACCESS_TOKEN_EXPIRES_IN_MINUTE\nJWT_REFRESH_TOKEN_EXPIRES_IN_DAYS=$JWT_REFRESH_TOKEN_EXPIRES_IN_DAYS\nEMAIL_SMTP_HOST=$EMAIL_SMTP_HOST\nEMAIL_SMTP_PORT=$EMAIL_SMTP_PORT\nEMAIL_SENDER_EMAIL=$EMAIL_SENDER_EMAIL\nEMAIL_SENDER_NAME=$EMAIL_SENDER_NAME\nEMAIL_APP_PASSWORD=$EMAIL_APP_PASSWORD\nCLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME\nCLOUDINARY_API_KEY=$CLOUDINARY_API_KEY\nCLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET\nPAYOS_CLIENT_ID=$PAYOS_CLIENT_ID\nPAYOS_API_KEY=$PAYOS_API_KEY\nPAYOS_CHECKSUM_KEY=$PAYOS_CHECKSUM_KEY\nPAYOS_RETURN_URL=$PAYOS_RETURN_URL\nPAYOS_CANCEL_URL=$PAYOS_CANCEL_URL\nALLOWED_ORIGINS=$ALLOWED_ORIGINS\nOTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_EXPORTER_OTLP_ENDPOINT\nOTEL_SERVICE_NAME=$OTEL_SERVICE_NAME\n" > .env

                      docker compose pull
                      docker compose up -d
